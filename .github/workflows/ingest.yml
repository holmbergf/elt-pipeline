name: ingest (nfl + ncaaf)

on:
  schedule:
    # Intended Pacific times, expressed in UTC (PT = UTC-8, standard time):
    # Sun 07:00 PT (pre-Sunday slate), Mon 13:00 PT (pre-Monday night),
    # Thu 13:00 PT (pre-Thursday night). GitHub cron is UTC-only, so during
    # daylight time (PDT, UTC-7) these fire one hour later Pacific-local.
    - cron: "0 15 * * 0"
    - cron: "0 21 * * 1"
    - cron: "0 21 * * 4"
    # Fri + Sat 07:00 PT: college games are mainly Fri/Sat, so the NCAAF
    # connector gets a 07:00 PT run on both days (pre-slate). It also runs
    # on the NFL triggers above (idempotent), which picks up Sat results
    # on Sun 07:00 PT.
    - cron: "0 15 * * 5"
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, backfill]
        default: incremental

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ingestion + dbt
        run: |
          pip install "./data-integration[iceberg]" dbt-duckdb duckdb
          # No browser needed: games=nflverse CSV, spreads/totals=Covers HTTP.
      - name: Run ingestion (games -> spreads -> totals)
        env:
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nfl
          BASIN_CATALOG_URI: ${{ secrets.BASIN_CATALOG_URI }}
          BASIN_WAREHOUSE: ${{ secrets.BASIN_WAREHOUSE }}
          BASIN_TOKEN: ${{ secrets.BASIN_TOKEN }}
        run: |
          retry() { # idempotent jobs: safe to re-run the whole step
            local n=1
            while true; do
              "$@" && return 0
              [ $n -ge 3 ] && return 1
              echo "attempt $n failed; retrying in $((n * 30))s"
              sleep $((n * 30)); n=$((n + 1))
            done
          }
          retry elt-ingest all --mode "${{ inputs.mode || 'incremental' }}"
      - name: Run NCAAF ingestion (ESPN games -> Covers spreads -> totals)
        env:
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nfl
          BASIN_CATALOG_URI: ${{ secrets.BASIN_CATALOG_URI }}
          BASIN_WAREHOUSE: ${{ secrets.BASIN_WAREHOUSE }}
          BASIN_TOKEN: ${{ secrets.BASIN_TOKEN }}
        run: |
          retry() { # idempotent jobs: safe to re-run the whole step
            local n=1
            while true; do
              "$@" && return 0
              [ $n -ge 3 ] && return 1
              echo "attempt $n failed; retrying in $((n * 30))s"
              sleep $((n * 30)); n=$((n + 1))
            done
          }
          retry elt-ingest --sport ncaaf all --mode "${{ inputs.mode || 'incremental' }}"
      - name: dbt build (prod) and publish warehouse tables
        working-directory: dbt-transform
        env:
          RAW_BASE_PATH: s3://nfl/ingestion
          RAW_BASE_PATH_NCAAF: s3://ncaaf/ingestion
          # Without these, publish_warehouse falls back to local storage and
          # the dashboard's Parquet exports are silently written to the
          # runner disk instead of R2 (publish_warehouse also guards this).
          STORAGE_BACKEND: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_HOST: ${{ secrets.R2_S3_HOST }}
          BASIN_CATALOG_URI: ${{ secrets.BASIN_CATALOG_URI }}
          BASIN_WAREHOUSE: ${{ secrets.BASIN_WAREHOUSE }}
          BASIN_TOKEN: ${{ secrets.BASIN_TOKEN }}
        run: |
          dbt seed --target prod --profiles-dir .
          dbt build --target prod --profiles-dir .
          python -m elt_ingest.publish_warehouse warehouse.duckdb
          python -m elt_ingest.publish_warehouse warehouse.duckdb --sport=ncaaf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-run-results
          path: dbt-transform/target/run_results.json
          if-no-files-found: ignore
      # Prod manifest consumed by ci/dbt slim selection (state:modified+)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dbt-state
          path: dbt-transform/target/manifest.json
          if-no-files-found: error
