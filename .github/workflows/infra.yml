name: ci/infra

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write
  statuses: write

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no state in CI by design)
        working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  # IssueOps deploys via github/branch-deploy:
  #   comment ".deploy"       -> terraform apply (production environment)
  #   comment ".deploy noop"  -> terraform plan only (dry run)
  # State is remote (R2 S3 backend, infra/backend.hcl). The deploy job
  # still fails loudly if TF_STATE_BACKEND_CONFIG is not set as a
  # repository variable; it never runs apply against empty runner-local state.
  branch-deploy:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Branch deploy check
        id: branch-deploy
        uses: github/branch-deploy@v12
        with:
          trigger: ".deploy"
          environment: production
      - uses: actions/checkout@v4
        if: steps.branch-deploy.outputs.continue == 'true'
        with:
          ref: ${{ steps.branch-deploy.outputs.branch }}
      - uses: hashicorp/setup-terraform@v3
        if: steps.branch-deploy.outputs.continue == 'true'
      - name: Require remote state backend
        if: steps.branch-deploy.outputs.continue == 'true'
        env:
          BACKEND: ${{ vars.TF_STATE_BACKEND_CONFIG }}
        run: |
          if [ -z "$BACKEND" ]; then
            echo "::error::TF_STATE_BACKEND_CONFIG repo variable is not set. Configure a remote Terraform backend (R2/S3) before using .deploy; refusing to apply against empty runner-local state."
            exit 1
          fi
      - name: Render backend config
        # backend.hcl is gitignored (account-specific endpoint); render it
        # from the committed template with this repo's account ID.
        if: steps.branch-deploy.outputs.continue == 'true'
        working-directory: infra
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ ! -f backend.hcl ]; then
            sed "s|<account-id>|$R2_ACCOUNT_ID|" backend.hcl.example > backend.hcl
          fi
      - name: Terraform init
        if: steps.branch-deploy.outputs.continue == 'true'
        working-directory: infra
        env:
          BACKEND: ${{ vars.TF_STATE_BACKEND_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config="$BACKEND"
      - name: Terraform plan (noop)
        if: steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true'
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false
      - name: Terraform apply
        if: steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true'
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform apply -input=false -auto-approve
