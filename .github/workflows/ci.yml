name: ci

# Always-on gate: unlike the path-filtered ci/* workflows, this runs on
# every PR and push so branch protection can require it without PRs that
# touch only some paths waiting forever on checks that never start.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e "./data-integration[dev,iceberg]"
          pip install -r dashboard/requirements.txt
      - name: Unit tests
        run: python -m pytest data-integration/tests dashboard/tests -q
